[project]
name = "web-slack-mcp"
version = "0.2.1"
description = "Draft-only MCP server that reads Slack via your own logged-in browser session (Playwright)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp>=1.28.1",
    "playwright>=1.61.0",
]

[project.scripts]
web-slack-mcp = "main:main"

[project.urls]
Homepage = "https://github.com/sercant/web-slack-mcp"
Repository = "https://github.com/sercant/web-slack-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
